
<script>
const scriptURL = "PASTE_URL_EXEC_AWAK_DI_SINI";

document.getElementById("feedbackForm")
  .addEventListener("submit", async function(event) {
    event.preventDefault();

    const status = document.getElementById("status");
    const button = this.querySelector("button");

    const data = {
      name: document.getElementById("name").value.trim(),
      message: document.getElementById("message").value.trim()
    };

    if (!data.message) {
      status.textContent = "Sila tulis mesej dahulu.";
      return;
    }

    button.disabled = true;
    button.textContent = "Menghantar...";
    status.textContent = "Sedang menghantar feedback...";

    try {
      await fetch(scriptURL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(data)
      });

      status.textContent =
        "Permintaan dihantar! Semak sama ada mesej masuk ke Google Sheets.";

      this.reset();
    } catch (error) {
      status.textContent =
        "Ralat penghantaran. Sila cuba lagi.";
    } finally {
      button.disabled = false;
      button.textContent = "Hantar Mesej ↗";
    }
  });
</script>
