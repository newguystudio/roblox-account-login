
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Feedback Hub</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #111216;
      color: white;
      font-family: Arial, sans-serif;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: #202127;
      border: 1px solid #35363f;
      border-radius: 16px;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
      text-align: center;
    }

    .logo span { color: #e53945; }

    p {
      color: #b8b8c2;
      text-align: center;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-size: 14px;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      color: white;
      background: #14151a;
      border: 1px solid #41424b;
      border-radius: 8px;
      font: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #e53945;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    #status {
      margin-top: 16px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .notice {
      font-size: 12px;
      color: #aaaab5;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="logo">ROBLOX <span>HUB</span></div>
    <p>Hantar feedback dan cadangan kamu kepada kami.</p>

    <form id="feedbackForm">
      <label for="name">Nama pengguna Roblox</label>
      <input id="name" maxlength="50"
        placeholder="Masukkan nama pengguna"
        autocomplete="nickname">

      <label for="message">Mesej feedback</label>
      <textarea id="message" maxlength="2000"
        placeholder="Tulis feedback kamu di sini..."
        required></textarea>

      <button type="submit">Hantar Mesej ↗</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>

    <p class="notice">
      Fan-made feedback website. Bukan laman rasmi Roblox.
      Jangan masukkan kata laluan atau kod pengesahan.
    </p>
  </main>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbywE0WK4vO2vS95Myi1p-qVrsl1FRcE5pxhiYAfCuj75O-okhD_RUIdYqq3qOtYb16naA/exec";

    document.getElementById("feedbackForm")
      .addEventListener("submit", async function(event) {
        event.preventDefault();

        const status = document.getElementById("status");
        const button = this.querySelector("button");

        const data = {
          name: document.getElementById("name").value.trim(),
          message: document.getElementById("message").value.trim()
        };

        if (!data.message) {
          status.textContent = "Sila tulis feedback dahulu.";
          return;
        }

        if (scriptURL === "PASTE_URL_EXEC_AWAK_DI_SINI") {
          status.textContent =
            "Sila tetapkan URL Google Apps Script dahulu.";
          return;
        }

        button.disabled = true;
        button.textContent = "Menghantar...";
        status.textContent = "Sedang menghantar feedback...";

        try {
          await fetch(scriptURL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(data)
          });

          status.textContent =
            "Permintaan dihantar. Semak Google Sheets untuk pengesahan.";
          this.reset();
        } catch (error) {
          status.textContent =
            "Penghantaran gagal. Sila cuba lagi.";
        } finally {
          button.disabled = false;
          button.textContent = "Hantar Mesej ↗";
        }
      });
  </script>
</body>
</html>
