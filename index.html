
<p>
  Website ini merekodkan lawatan dan klik untuk analitik.
  Lokasi bandar/negara ialah anggaran melalui IP.
  GPS hanya dikongsi jika anda memilih untuk berkongsi.
</p>

<button id="shareLocation" type="button">
  Saya bersetuju berkongsi lokasi GPS
</button>
<p id="trackerStatus" role="status" aria-live="polite"></p>

<script>
(() => {
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz5gvWjVMdq_HbfW2JT5b4Q6FEfOS3yjgosXBdNK1qadq0bwhio8oEesPwV5r7vDMk4/exec";

  const status = document.getElementById("trackerStatus");
  const gpsButton = document.getElementById("shareLocation");

  // Hantar hanya medan analitik yang dibenarkan.
  function logEvent(event, extra = {}) {
    const payload = {
      event,
      page: location.pathname,
      target: extra.target || "",
      country: extra.country || "",
      city: extra.city || "",
      latitude: extra.latitude ?? "",
      longitude: extra.longitude ?? ""
    };

    // no-cors bermakna browser tidak dapat mengesahkan
    // sama ada Apps Script berjaya menyimpan rekod.
    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(payload),
      keepalive: true
    }).catch(() => {});
  }

  // Rekod lawatan.
  logEvent("visit");

  // Rekod klik tanpa membaca input atau kata laluan.
  document.addEventListener("click", event => {
    const el = event.target.closest("button, a");
    if (!el) return;

    const target = el.tagName === "A"
      ? "Link: " + el.href
      : "Button: " + (el.innerText || el.id || "Unnamed");

    logEvent("click", { target: target.slice(0, 150) });
  });

  // Lokasi anggaran: hanya selepas memaklumkan pelawat.
  // IP dihantar kepada ipwho.is, perkhidmatan pihak ketiga.
  const consent = document.createElement("label");
  consent.style.display = "block";
  consent.style.marginTop = "10px";

  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";

  consent.append(
    checkbox,
    document.createTextNode(
      " Saya bersetuju meminta anggaran negara/bandar melalui IP " +
      "daripada perkhidmatan ipwho.is."
    )
  );

  gpsButton.insertAdjacentElement("afterend", consent);

  checkbox.addEventListener("change", async () => {
    if (!checkbox.checked) return;

    status.textContent = "Mendapatkan lokasi anggaran...";

    try {
      const response = await fetch("https://ipwho.is/");
      const data = await response.json();

      if (!data.success) throw new Error("Location unavailable");

      logEvent("visit", {
        country: data.country || "",
        city: data.city || ""
      });

      status.textContent =
        "Lokasi anggaran: " +
        [data.city, data.country].filter(Boolean).join(", ");
    } catch {
      status.textContent =
        "Lokasi anggaran tidak tersedia buat masa ini.";
    }
  });

  // GPS hanya selepas klik butang secara jelas.
  gpsButton.addEventListener("click", () => {
    if (!navigator.geolocation) {
      status.textContent = "Pelayar tidak menyokong GPS.";
      return;
    }

    status.textContent = "Sila jawab permintaan kebenaran lokasi.";

    navigator.geolocation.getCurrentPosition(
      position => {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        logEvent("gps_shared", {
          latitude,
          longitude
        });

        const mapsUrl =
          "https://www.google.com/maps?q=" +
          latitude + "," + longitude;

        status.replaceChildren();

        const message = document.createElement("p");
        message.textContent =
          "Lokasi GPS dikongsi. Koordinat: " +
          latitude + ", " + longitude;

        const map = document.createElement("a");
        map.href = mapsUrl;
        map.target = "_blank";
        map.rel = "noopener noreferrer";
        map.textContent = "Lihat lokasi pada Google Maps";

        status.append(message, map);
      },
      () => {
        status.textContent =
          "Lokasi tidak dikongsi atau kebenaran ditolak.";
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  });
})();
</script>
